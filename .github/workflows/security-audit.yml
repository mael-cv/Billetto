name: Security Audit

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Moindre privilège : aucun secret requis par cet audit.
permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # White-box : SAST / secrets / dépendances / docker / CI / infra. Sans app.
  # Les scanners open-source sont installés ici ; le cœur reste indépendant.
  # ---------------------------------------------------------------------------
  whitebox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Scanners optionnels (téléchargés directement, sans action tierce).
      - name: Scanners open-source (best-effort)
        continue-on-error: true
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh >/dev/null 2>&1 || true
          # gitleaks
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz && sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks || true
          # trivy
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin || true
          # osv-scanner
          curl -sSfL -o /usr/local/bin/osv-scanner https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 && sudo chmod +x /usr/local/bin/osv-scanner || true
          # semgrep
          pipx install semgrep || pip install --user semgrep || true

      - name: Audit white-box
        run: pnpm --filter @billetto/security-audit exec tsx src/cli.ts --sast --secrets --dependencies --infra --ci --format all

      - name: Rapport (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-whitebox
          path: doc/security-audit/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Black-box : pentest actif contre l'app réellement démarrée (comme ci.yml).
  # ---------------------------------------------------------------------------
  blackbox:
    runs-on: ubuntu-latest
    needs: whitebox
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @billetto/api prisma:generate

      - name: Environnement de CI (.env éphémère)
        run: |
          cp .env.example .env
          PG_PASSWORD="ci-$(openssl rand -hex 12)"
          APP_PASSWORD="ci-app-$(openssl rand -hex 12)"
          sed -i \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${PG_PASSWORD}|" \
            -e "s|^PGADMIN_DEFAULT_PASSWORD=.*|PGADMIN_DEFAULT_PASSWORD=ci-$(openssl rand -hex 8)|" \
            -e "s|^DATABASE_URL=.*|DATABASE_URL=postgresql://billetto_owner:${PG_PASSWORD}@localhost:5433/billetto|" \
            -e "s|^APP_DB_PASSWORD=.*|APP_DB_PASSWORD=${APP_PASSWORD}|" \
            -e "s|^APP_DATABASE_URL=.*|APP_DATABASE_URL=postgresql://billetto_app:${APP_PASSWORD}@localhost:5433/billetto|" \
            -e "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" \
            -e "s|^SMTP_URL=.*|SMTP_URL=|" \
            .env

      - name: Base + API
        run: |
          docker compose up -d --wait postgres
          pnpm db:migrate
          pnpm db:seed:small
          pnpm db:seed:demo
          docker compose up -d --wait api

      - name: Pentest (profil full)
        run: pnpm --filter @billetto/security-audit exec tsx src/cli.ts --pentest --full --ci --format all --base-url http://127.0.0.1:3001/api/v1

      - name: Rapport (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-blackbox
          path: doc/security-audit/
          if-no-files-found: ignore

      - name: Journaux API/Postgres en cas d'échec
        if: failure()
        run: docker compose logs api postgres --tail 200
