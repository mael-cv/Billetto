name: Security Audit

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Moindre privilège : aucun secret requis par cet audit.
permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # White-box : SAST / secrets / dépendances / docker / CI / infra. Sans app.
  # Les scanners open-source sont installés ici ; le cœur reste indépendant.
  # ---------------------------------------------------------------------------
  whitebox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Scanners optionnels : versions figées, archives publiées téléchargées directement
      # (aucun script d'installation exécuté en root, aucune branche ni « latest »).
      - name: Scanners open-source (best-effort)
        continue-on-error: true
        env:
          GITLEAKS_VERSION: 8.21.2
          TRIVY_VERSION: 0.58.1
          OSV_SCANNER_VERSION: 1.9.2
          SEMGREP_VERSION: 1.101.0
        run: |
          mkdir -p "$HOME/.local/bin" /tmp/scanners
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # gitleaks
          curl -sSfL -o /tmp/scanners/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            && tar -xzf /tmp/scanners/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks || true
          # trivy
          curl -sSfL -o /tmp/scanners/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            && tar -xzf /tmp/scanners/trivy.tar.gz -C "$HOME/.local/bin" trivy || true
          # osv-scanner
          curl -sSfL -o "$HOME/.local/bin/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            && chmod +x "$HOME/.local/bin/osv-scanner" || true
          # semgrep
          pipx install "semgrep==${SEMGREP_VERSION}" || pip install --user "semgrep==${SEMGREP_VERSION}" || true

      - name: Audit white-box
        run: pnpm --filter @billetto/security-audit exec tsx src/cli.ts --sast --secrets --dependencies --infra --ci --format all

      - name: Rapport (artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-report-whitebox
          path: doc/security-audit/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Black-box : pentest actif contre l'app réellement démarrée (comme ci.yml).
  # ---------------------------------------------------------------------------
  blackbox:
    runs-on: ubuntu-latest
    needs: whitebox
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Exactement ce que fait un utilisateur : aucun fichier à créer, aucun secret.
      - name: Démarrage de la pile complète
        run: docker compose up -d --build --wait web

      # Attaque l'assistant de premier démarrage, l'utilise légitimement (jeton lu
      # dans les journaux), puis attaque l'application initialisée.
      - name: Campagne d'attaque (curl)
        run: bash scripts/pentest.sh

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs bootstrap init seeder api web --tail 200
