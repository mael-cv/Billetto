name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository and history for secrets
        run: docker run --rm -v "$GITHUB_WORKSPACE:/path:ro" ghcr.io/gitleaks/gitleaks:v8.29.1 detect --source=/path --redact --no-banner

  # ---------------------------------------------------------------------------
  # Qualité du code : lint, types, tests unitaires, build (sans base de données)
  # ---------------------------------------------------------------------------
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Client Prisma
        run: pnpm --filter @billetto/api prisma:generate
      - name: Lint
        run: pnpm lint
      - name: Types (API, web et security-audit)
        run: |
          pnpm --filter @billetto/api exec tsc --noEmit -p tsconfig.json
          pnpm --filter @billetto/web exec tsc --noEmit -p tsconfig.json
          pnpm --filter @billetto/security-audit exec tsc --noEmit -p tsconfig.json
      - name: Tests unitaires
        # inclut les tests du moteur security-audit (unitaires + acceptance fixture, sans base)
        run: pnpm test
      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Base réelle (PostgreSQL 17 via docker compose, comme en local) :
  # migrations, seeds, tests SQL + concurrence + isolation, e2e API, charge.
  # ---------------------------------------------------------------------------
  database:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    env:
      # Surcouche de développement : bases publiées sur la boucle locale du runner, Mailpit.
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @billetto/api prisma:generate

      # Aucun secret dans le dépôt ni dans la CI : le conteneur « bootstrap » les
      # génère dans des volumes, « env-pull » les copie pour les tests lancés sur le runner.
      - name: Bases, migrations et configuration générée
        run: |
          docker compose up -d --wait postgres mongodb mailpit
          docker compose up init
          node scripts/env-pull.mjs
          sed -i -e "s|^SMTP_URL=.*|SMTP_URL=|" .env

      - name: Jeu de démonstration
        run: pnpm db:init

      - name: Tests SQL, concurrence et isolation RLS
        run: pnpm db:test

      - name: Tests e2e API
        run: pnpm test:e2e

      - name: Charge combinée (holds, confirmations, expiration, liste d'attente)
        run: pnpm test:load
        env:
          LOAD_USERS: 100

      - name: Journaux PostgreSQL en cas d'échec
        if: failure()
        run: docker compose logs postgres --tail 200
