# Sonde de santé interne (boucle locale du conteneur, HTTP simple).
server {
    listen 127.0.0.1:8081;
    server_tokens off;
    access_log off;
    location = /healthz {
        return 204;
    }
}

server {
    # Image nginx non-root : port non privilégié. HTTPS uniquement ; le
    # certificat auto-signé est créé par le conteneur init (volume web_certs).
    listen 8443 ssl;
    http2 on;
    server_name localhost;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/billetto.crt;
    ssl_certificate_key /etc/nginx/certs/billetto.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # Requête HTTP en clair sur le port HTTPS : redirection plutôt qu'une erreur 400.
    error_page 497 =308 https://$http_host$request_uri;

    # Corps limités comme côté API (64 Ko) ; délais courts contre les connexions lentes.
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # Assets Vite avec hash dans le nom (cache immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        # En-têtes de sécurité (répétés : une location qui pose add_header n'hérite
        # pas de ceux du server). Polices Google Fonts, images Unsplash.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        try_files $uri =404;
    }

    # Proxy inverse vers l'API NestJS (seul chemin d'accès à l'API).
    location /api/ {
        # Résolution DNS à chaque requête (résolveur interne de Docker) : l'API
        # redémarre après l'assistant de premier démarrage et peut changer d'adresse.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # Pas de websocket : keep-alive HTTP/1.1 simple, aucune montée de protocole.
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # L'en-tête fourni par le client est écrasé : l'API (trustProxy = 1 saut)
        # ne voit que l'adresse constatée par nginx.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # SPA routing : toutes les autres requêtes servent index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # En-têtes de sécurité (répétés : une location qui pose add_header n'hérite
        # pas de ceux du server). Polices Google Fonts, images Unsplash.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    }
}
