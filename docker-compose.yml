name: billetto

# « git clone » puis « docker compose up -d » : aucun fichier à créer.
#
# Ce fichier ne contient et n'attend AUCUN secret. Au premier démarrage, le
# conteneur « bootstrap » génère tous les mots de passe dans deux volumes :
#   secrets  identifiants d'administration des bases (postgres, mongodb, init, seeder) ;
#   config   configuration de l'API (compte restreint, secret de session, mode, clés Stripe).
# L'application s'initialise ensuite depuis le navigateur (https://localhost:3000),
# avec le jeton affiché par « docker compose logs bootstrap ».
#
# Seul le front (HTTPS) est publié. Outils de développement : docker-compose.dev.yml.

services:
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      target: init
    image: ${INIT_IMAGE:-billetto-init:local}
    command: ["node", "database/scripts/bootstrap-config.mjs"]
    environment:
      PUBLIC_URL: https://localhost:${WEB_PORT:-3000}
    volumes:
      - secrets:/secrets
      - config:/config

  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: billetto_owner
      POSTGRES_DB: billetto
      POSTGRES_PASSWORD_FILE: /run/billetto/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/database:ro
      - secrets:/run/billetto:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  mongodb:
    image: mongo:7.0-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: billetto_mongo
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/billetto/mongo_password
      MONGO_INITDB_DATABASE: billetto_nosql
    volumes:
      - mongodb_data:/data/db
      - ./database/nosql:/database/nosql:ro
      - secrets:/run/billetto:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  # Migrations SQL, schéma MongoDB, compte MongoDB restreint de l'API, certificat TLS.
  init:
    build:
      context: .
      dockerfile: Dockerfile
      target: init
    image: ${INIT_IMAGE:-billetto-init:local}
    command: ["node", "database/scripts/init-auto.mjs"]
    environment:
      BILLETTO_ENV_FILE: /secrets/infra.env
      TLS_CERT_DIR: /certs
    volumes:
      - secrets:/secrets:ro
      - web_certs:/certs
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  # Attend l'assistant de premier démarrage, charge le jeu de démonstration en
  # mode test, puis crée le premier administrateur. Se termine ensuite.
  seeder:
    build:
      context: .
      dockerfile: Dockerfile
      target: init
    image: ${INIT_IMAGE:-billetto-init:local}
    command: ["node", "database/scripts/seeder.mjs"]
    restart: on-failure:3
    environment:
      BILLETTO_ENV_FILE: /secrets/infra.env
      CONFIG_DIR: /config
    volumes:
      - secrets:/secrets:ro
      - config:/config:ro
    depends_on:
      init:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: ${API_IMAGE:-billetto-api:local}
    # Redémarre seule après l'assistant, pour charger la configuration complétée.
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      BILLETTO_ENV_FILE: /config/api.env
      CONFIG_DIR: /config
      STRIPE_TEST_KEYS_FILE: /run/billetto/stripe-test-keys.env
      # Origine publique du front (HTTPS, certificat auto-signé).
      CORS_ORIGIN: https://localhost:${WEB_PORT:-3000}
      COOKIE_SECURE: "true"
      # Un seul saut de confiance : nginx. L'API n'est pas publiée, l'adresse du
      # client est celle que nginx place dans X-Forwarded-For.
      TRUST_PROXY: "1"
    volumes:
      - config:/config
      - ./infra/stripe/test-keys.env:/run/billetto/stripe-test-keys.env:ro
    expose:
      - "3001"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 768m

  # Relais des webhooks Stripe vers l'API (mode test uniquement) : Stripe ne peut
  # pas joindre une machine locale. Attend que l'assistant ait choisi le mode.
  stripe-cli:
    image: stripe/stripe-cli:v1.55.11
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/relay.sh"]
    volumes:
      - config:/config:ro
      - ./infra/stripe/relay.sh:/relay.sh:ro
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: ${WEB_IMAGE:-billetto-web:local}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:8443"
    volumes:
      - web_certs:/etc/nginx/certs:ro
    depends_on:
      init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8081/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 128m

volumes:
  postgres_data:
  mongodb_data:
  web_certs:
  secrets:
  config:
