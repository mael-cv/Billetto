name: billetto

services:
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billetto_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billetto_owner_pass}
      POSTGRES_DB: ${POSTGRES_DB:-billetto}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database:/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:7.0-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-billetto_mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-billetto_mongo_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-billetto_nosql}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/nosql:/database/nosql:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  # SMTP de développement : capture tous les e-mails (interface web :8025).
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports:
      - "1025:1025"
      - "8025:8025"

  pgadmin:
    image: dpage/pgadmin4:9@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@billetto.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-billetto-pgadmin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local', 'test', 'internal', 'billetto.local', 'billetto.test']"
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Initialisation automatique au lancement : vérifie/applique migrations SQL, seeds PostgreSQL et templates MongoDB
  init:
    build:
      context: .
      dockerfile: Dockerfile
      target: init
    image: ${INIT_IMAGE:-${DOCKER_USER:-litmaaa}/billetto-init:latest}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billetto_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billetto_owner_pass}
      POSTGRES_DB: ${POSTGRES_DB:-billetto}
      PGHOST: postgres
      PGPORT: 5432
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-billetto_app_pass}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Billetto-Demo-2026!}
      SEED: ${SEED:-20260916}
      MONGO_URL: mongodb://${MONGO_USER:-billetto_mongo}:${MONGO_PASSWORD:-billetto_mongo_pass}@mongodb:27017/${MONGO_DB:-billetto_nosql}?authSource=admin
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: ${API_IMAGE:-${DOCKER_USER:-litmaaa}/billetto-api:latest}
    environment:
      # Compose est le profil de développement local (HTTP localhost).
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 3001
      APP_DATABASE_URL: postgresql://billetto_app:${APP_DB_PASSWORD:-billetto_app_pass}@postgres:5432/${POSTGRES_DB:-billetto}
      MONGO_URL: mongodb://${MONGO_USER:-billetto_mongo}:${MONGO_PASSWORD:-billetto_mongo_pass}@mongodb:27017/${MONGO_DB:-billetto_nosql}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-billetto-0123456789abcdef}
      PAYMENTS_WEBHOOK_SECRET: ${PAYMENTS_WEBHOOK_SECRET:-dev-only-webhook-secret-billetto-0123456789abcdef}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-7200}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3001:3001"
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: ${WEB_IMAGE:-${DOCKER_USER:-litmaaa}/billetto-web:latest}
    ports:
      - "3000:8080"
    depends_on:
      - api

volumes:
  pg_data:
  pgadmin_data:
  mongo_data:
